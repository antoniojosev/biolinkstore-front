<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072F4A"/>
      <stop offset="55%" stop-color="#0F6BA8"/>
      <stop offset="100%" stop-color="#0A5285"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="82%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#6FC2E8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6FC2E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#coralGlow)"/>
  <rect width="1200" height="630" fill="url(#tealGlow)"/>

  <!-- Decorative chain links (motif: by + link) -->
  <g transform="translate(900, 300)" stroke-width="10" fill="none" opacity="0.85">
    <!-- left link (turquoise) -->
    <rect x="-110" y="-70" width="140" height="140" rx="70" ry="70" stroke="#6FC2E8"/>
    <!-- right link (coral) -->
    <rect x="-30" y="-70" width="140" height="140" rx="70" ry="70" stroke="#FF6B4A"/>
  </g>

  <!-- Soft underline bar -->
  <rect x="80" y="470" width="160" height="6" rx="3" fill="#FF6B4A"/>

  <!-- Wordmark -->
  <text x="80" y="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="148" font-weight="800" letter-spacing="-4">
    <tspan fill="#FFFFFF">by</tspan><tspan fill="#FF6B4A">link</tspan>
  </text>

  <!-- Tagline -->
  <text x="80" y="380" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#E7F2FA" letter-spacing="-1">
    Deja de perder pedidos en los DMs
  </text>

  <!-- Subtitle -->
  <text x="80" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#B6D6EC">
    Tu catalogo en un link. Pedidos directo a tu WhatsApp.
  </text>

  <!-- Bottom row: trust bullets -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#D4EAF5">
    <circle cx="90" cy="550" r="7" fill="#FF6B4A"/>
    <text x="108" y="557">Sin comisiones</text>
    <circle cx="320" cy="550" r="7" fill="#6FC2E8"/>
    <text x="338" y="557">WhatsApp nativo</text>
    <circle cx="580" cy="550" r="7" fill="#6FC2E8"/>
    <text x="598" y="557">Lista en 5 minutos</text>
  </g>
</svg>