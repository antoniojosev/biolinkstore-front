<!-- bylink — payment report (admin notification)
     Backend: src/modules/payment-reports/application/use-cases/create-payment-report.use-case.ts
     Placeholders: {{typeLabel}} {{storeName}} {{storeUsername}} {{storeId}} {{plan}}
                   {{customerName}} {{bank}} {{transferDate}} {{notes}} {{proofUrl}} -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<title>Reporte de pago</title>
</head>
<body style="margin:0; padding:0; background:#FAFBFD;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFBFD; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;">
          <tr>
            <td style="background:#1E3A8A; border-radius:16px 16px 0 0; padding:24px 32px;">
              <span style="font-size:20px; font-weight:800; letter-spacing:-0.025em; color:#FFFFFF;">bylink<span style="color:#F97066;">.</span></span>
              <div style="margin-top:8px;"><span style="display:inline-block; background:rgba(255,255,255,0.14); color:#FFFFFF; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;">💸 {{typeLabel}}</span></div>
            </td>
          </tr>
          <tr>
            <td style="background:#FFFFFF; border:1px solid #E5E9F0; border-top:none; border-radius:0 0 16px 16px; padding:28px 32px;">
              <div style="font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#94A3B8; margin-bottom:8px;">Datos de la tienda</div>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px; color:#0A0F1F; margin-bottom:24px;">
                <tr><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8; width:140px;">Tienda</td><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; font-weight:600;">{{storeName}}</td></tr>
                <tr><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Usuario</td><td style="padding:7px 0; border-bottom:1px solid #E5E9F0;">{{storeUsername}}</td></tr>
                <tr><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Store ID</td><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; font-family:'JetBrains Mono',monospace; font-size:12px;">{{storeId}}</td></tr>
                <tr><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Plan actual</td><td style="padding:7px 0; border-bottom:1px solid #E5E9F0;">{{plan}}</td></tr>
              </table>

              <div style="font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#94A3B8; margin-bottom:8px;">Datos del cliente</div>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px; color:#0A0F1F; margin-bottom:24px;">
                <tr><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8; width:140px;">Cliente</td><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; font-weight:600;">{{customerName}}</td></tr>
                <tr><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Banco</td><td style="padding:7px 0; border-bottom:1px solid #E5E9F0;">{{bank}}</td></tr>
                <tr><td style="padding:7px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Fecha</td><td style="padding:7px 0; border-bottom:1px solid #E5E9F0;">{{transferDate}}</td></tr>
                <tr><td style="padding:7px 0; color:#94A3B8; vertical-align:top;">Notas</td><td style="padding:7px 0; line-height:1.5;">{{notes}}</td></tr>
              </table>

              <a href="{{proofUrl}}" style="display:inline-block; background:#1E3A8A; color:#FFFFFF; font-size:14px; font-weight:600; text-decoration:none; padding:12px 22px; border-radius:10px;">Ver comprobante →</a>
            </td>
          </tr>
          <tr><td align="center" style="padding:20px 0; font-size:12px; color:#94A3B8;">bylink · notificación interna</td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
