<!-- bylink — demo request (admin notification)
     Backend: src/modules/contact/contact.use-case.ts (getDemoRequestEmailHtml)
     Placeholders: {{name}} {{email}} {{phone}} {{company}} {{instagram}} {{message}} {{requestedDateTime}} -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<title>Nueva solicitud de demo</title>
</head>
<body style="margin:0; padding:0; background:#FAFBFD;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFBFD; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;">
          <tr>
            <td style="background:#1E3A8A; border-radius:16px 16px 0 0; padding:24px 32px;">
              <span style="font-size:20px; font-weight:800; letter-spacing:-0.025em; color:#FFFFFF;">bylink<span style="color:#F97066;">.</span></span>
              <div style="margin-top:8px; font-size:13px; color:rgba(255,255,255,0.75);">Nueva solicitud de demo personalizada</div>
            </td>
          </tr>
          <tr>
            <td style="background:#FFFFFF; border:1px solid #E5E9F0; border-top:none; border-radius:0 0 16px 16px; padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px; color:#0A0F1F;">
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8; width:140px;">Nombre</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; font-weight:600;">{{name}}</td></tr>
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Email</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0;">{{email}}</td></tr>
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Teléfono</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0;">{{phone}}</td></tr>
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Empresa</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0;">{{company}}</td></tr>
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Instagram</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0;">{{instagram}}</td></tr>
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8; vertical-align:top;">Mensaje</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; line-height:1.5;">{{message}}</td></tr>
              </table>
              <div style="margin-top:20px; display:inline-block; background:#EFF3FB; color:#1E3A8A; font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px;">📅 {{requestedDateTime}}</div>
            </td>
          </tr>
          <tr><td align="center" style="padding:20px 0; font-size:12px; color:#94A3B8;">bylink · notificación interna</td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
