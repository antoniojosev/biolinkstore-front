<!-- bylink — inquiry (admin notification)
     Backend: src/modules/contact/contact.use-case.ts (sendInquiry)
     Placeholders: {{typeLabel}} {{storeName}} {{method}} {{contact}} {{description}} {{timestamp}} -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<title>Nueva solicitud</title>
</head>
<body style="margin:0; padding:0; background:#FAFBFD;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFBFD; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;">
          <tr>
            <td style="background:linear-gradient(135deg,#1E3A8A,#172554); border-radius:16px 16px 0 0; padding:24px 32px;">
              <span style="font-size:20px; font-weight:800; letter-spacing:-0.025em; color:#FFFFFF;">bylink<span style="color:#F97066;">.</span></span>
              <div style="margin-top:10px;"><span style="display:inline-block; background:rgba(249,112,102,0.18); color:#F97066; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:4px 10px; border-radius:999px;">{{typeLabel}}</span></div>
              <div style="margin-top:8px; font-size:15px; font-weight:600; color:#FFFFFF;">{{storeName}}</div>
            </td>
          </tr>
          <tr>
            <td style="background:#FFFFFF; border:1px solid #E5E9F0; border-top:none; border-radius:0 0 16px 16px; padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px; color:#0A0F1F;">
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8; width:140px;">Tienda</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; font-weight:600;">{{storeName}}</td></tr>
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Método</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0;">{{method}}</td></tr>
                <tr><td style="padding:8px 0; border-bottom:1px solid #E5E9F0; color:#94A3B8;">Contacto</td><td style="padding:8px 0; border-bottom:1px solid #E5E9F0;">{{contact}}</td></tr>
                <tr><td style="padding:8px 0; color:#94A3B8; vertical-align:top;">Descripción</td><td style="padding:8px 0; line-height:1.5;">{{description}}</td></tr>
              </table>
            </td>
          </tr>
          <tr><td align="center" style="padding:20px 0; font-size:12px; color:#94A3B8;">{{timestamp}} · bylink</td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
